<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Panel de imágenes | Compacto Urbano</title><link rel="stylesheet" href="/admin/admin.css"></head><body><div class="admin-shell"><aside class="sidebar"><a href="/" class="brand"><img src="/img/logo/logo.png" alt=""><span>Compacto Urbano<small>Panel de imágenes</small></span></a><nav><button data-view="images" class="active">Imágenes</button><button data-view="history">Historial</button><button data-view="settings">Ajustes</button></nav><button id="signout" class="signout">Cerrar sesión</button></aside><main class="admin-main"><header><div><span class="eyebrow">Administración</span><h1 id="view-title">Imágenes de la página</h1></div><a href="/" target="_blank" rel="noopener">Ver página ↗</a></header><p id="admin-message" role="status"></p><section id="images-view"><div class="toolbar"><label>Sección<select id="section-filter"><option value="">Todas las secciones</option></select></label><label>Buscar imagen<input id="image-search" type="search" placeholder="Buscar por nombre o ruta"></label></div><div id="image-grid" class="image-grid"></div></section><section id="history-view" hidden><div id="history-list"></div></section><section id="settings-view" hidden><div class="settings-card"><h2>Cuenta administradora</h2><p>Correo actual: <strong id="current-email"></strong></p><form id="email-form"><label>Nuevo correo<input name="email" type="email" required></label><button>Actualizar correo</button></form><form id="password-form"><label>Nueva contraseña<input name="password" type="password" minlength="6" required></label><button>Cambiar contraseña</button></form><p>Los cambios de correo pueden requerir confirmación en ambos correos.</p></div></section></main></div><dialog id="editor"><form id="image-form" method="dialog"><button type="button" id="close-editor" class="close" aria-label="Cerrar">×</button><h2 id="editor-title">Editar imagen</h2><p id="editor-path"></p><div class="preview-pair"><figure><img id="original-preview" alt=""><figcaption>Original</figcaption></figure><figure><img id="new-preview" alt=""><figcaption>Vista previa</figcaption></figure></div><label>Archivo JPG, PNG, WebP o AVIF<input id="image-file" type="file" accept="image/jpeg,image/png,image/webp,image/avif"></label><label>Texto alternativo<input id="image-alt" maxlength="240" required></label><div class="editor-actions"><button id="publish-image" type="button">Publicar cambios</button><button id="restore-image" type="button" class="secondary">Restaurar original</button></div><p id="editor-message" role="status"></p></form></dialog><script src="/admin/admin.bundle.js" defer></script></body></html>
